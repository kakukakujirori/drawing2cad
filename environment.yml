# Renderer / CAD environment for drawing2cad (Phase-1 synthetic-drawing renderer).
# Pulls FreeCAD from conda-forge so `import FreeCAD` works natively -- no source
# build and no PYTHONPATH hacks. Both renderer stages (FreeCAD HLR projection and
# matplotlib/ezdxf drawing) run in THIS single env.
#
#   conda env create -f environment.yml
#   conda activate drawing2cad
#   scripts/renderer/run_batch.sh <step_dir> <out_dir> [N]
#
# (On a host with a *source-built* FreeCAD instead of conda-forge, skip `freecad`
#  here and point FREECAD_LIBDIR at the build's lib dir before running.)
name: drawing2cad
channels:
  - conda-forge
dependencies:
  - python=3.11
  - freecad=1.0.*
  - numpy
  - matplotlib-base
  - ezdxf
  - pip
