model_name_or_path: ADSKAILab/Zero-To-CAD-Qwen3-VL-2B
attn_implementation: flash_attention_2
torch_dtype: bfloat16
gradient_checkpointing: false
freeze_vision_encoder: true

primitive:
  sample_feature_dim: 7
  num_primitive_types: 7
  primitive_dim: 256
  num_primitive_latents: 32
  primitive_encoder_layers: 2
  resampler_layers: 2
  resampler_heads: 8
  dropout: 0.1
  use_group_context: false
  view_directions:
    - front
    - top
    - right
  # Must match DXF_ORIENTED_SAMPLE_FEATURE_INDICES:
  # (tangent_x, tangent_y, curvature, arc_length_position)
  oriented_feature_indices:
    - 3
    - 4
    - 5
    - 6

lora:
  enabled: true
  rank: 16
  alpha: 32
  dropout: 0.05
  bias: none
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

vision_lora:
  enabled: false
