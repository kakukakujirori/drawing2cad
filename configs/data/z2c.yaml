# Each split is a list of dataset roots. Every root must provide
# render_3d/, target/, target_audit/ and techdraw/ (src/data/layout.py validates
# this up front). Within a root, a sample counts as available only when its
# techdraw/dxf/ drawing, every raster named under `image_sources` below, and (for
# training) its target/*.cadquery.py are all on disk; parts the renderer lost to
# an OCC hang are reported at startup and skipped, not treated as an error.
# Roots are named by their basename; the name namespaces validation metrics
# (val/<name>/...) and the per-dataset prediction directory, so basenames must be
# unique.
train_root:
  - ${paths.project_root}/data/z2c_train
val_root:
  - ${paths.project_root}/data/z2c_val
  - ${paths.project_root}/data/eccv2026-cad-challenge-data/my_codes/test_vlm
image_sources:
  - style: isometric
    directory: render_3d/hlg_perspective
scale_augmentation: false
image_max_edge: null
# Modality dropout, training stream only: with this probability every image
# listed in `image_sources` above is replaced by a constant `image_dropout_fill`
# image of the same size, so the answer has to come from the drawing primitives.
# As configured that is the one isometric render, which is a preview of the
# finished solid; the technical drawing itself reaches the model only as DXF
# primitives. The render alone is enough to keep the loss falling, which is why
# `val/<root>/primitive_gain` sat below 1% of the loss without this.
#
# 0.5 leaves half the steps training the render->code path that the generation
# benchmark actually measures at test time (it always sees the real render).
# 0.75 forces the primitives harder at the cost of giving that path a quarter of
# the data; try it once `primitive_gain` shows how far 0.5 moves the needle.
#
# Blanking rather than removing keeps the token sequence length, and therefore
# `max_sequence_length` filtering, intact.
image_dropout: 0.5
# 0 = black, 255 = white. The renders are white-background line art, so 255 is
# an empty sheet, which the frozen vision tower can encode in its normal
# activation regime; 0 is unambiguous but out of distribution for a tower that
# cannot adapt to it.
image_dropout_fill: 0
# Samples whose fully rendered token sequence exceeds this are dropped (never
# truncated) before the DataLoader is built, bounding peak memory per step.
# Set to null to disable filtering.
max_sequence_length: 3072

# GT-audit gate (src/data/audit). Disabled by default: the gate is fail-closed
# and intersects the rendered corpus with the audited allow-set, so enabling it
# against an INCOMPLETE audit silently shrinks training to whatever was audited
# (it only errors on an *empty* intersection). Enable only after Step 2 has
# audited the FULL split. To enable, replace `audit: null` with the block below.
#
# Keeps a sample only if its audited verdict is acceptable: severity `ok` always
# passes; `soft_suspect` passes iff every one of its reason codes is in
# `allow_reasons`; `hard_invalid` / `unauditable` pass only via their blanket
# flags. The verdicts are read from `<root>/target_audit/results.jsonl` for each
# root above (the `gt_audit.py --out-dir`), so this block carries the policy
# only. The same policy gates training and the validation benchmark.
# audit: null
audit:
  allow_reasons:
    # OCCT Boolean-argument self-interference is broader than material overlap;
    # downstream-unusable cases are rejected separately as mesh_not_watertight.
    - bop_self_interference
    - thin_wall
    - noop_operation
    - micro_edge
    - micro_face
    - tolerance_bloat
    - kernel_small_edge
  allow_hard: false
  allow_unauditable: false

dxf:
  samples_per_primitive: 16
  spline_flattening_distance_mm: 0.05
  included_layers:
    - front
    - top
    - right
  include_visible: true
  include_hidden: true
  sheet_width_mm: 297.0
  sheet_height_mm: 210.0
  normalized_longest_side: 1.8
  discard_outside_sheet: true
  sheet_tolerance_mm: 1.0
  strict_entity_types: false

train_max_samples: null
val_max_samples: null
train_batch_size: 1
val_batch_size: 1
num_workers: 8
pin_memory: true
persistent_workers: true
shuffle_train: true
drop_last: false
