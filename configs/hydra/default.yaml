# @package hydra
run:
  dir: ${paths.log_root}/${now:%Y-%m-%d_%H-%M-%S}
sweep:
  dir: ${paths.log_root}/multirun/${now:%Y-%m-%d_%H-%M-%S}
  subdir: ${hydra.job.num}
job:
  chdir: false
output_subdir: null
job_logging:
  version: 1
  disable_existing_loggers: false
  formatters:
    simple:
      format: "[%(asctime)s][%(levelname)s][%(name)s] %(message)s"
  handlers:
    console:
      class: logging.StreamHandler
      formatter: simple
      stream: ext://sys.stdout
  root:
    handlers:
      - console
    level: INFO

