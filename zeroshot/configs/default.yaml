# @package _global_

defaults:
  - _self_
  - input: test_eccv  # png_dimensioned, dxf, ...
  - workflow: coder_auditor
  - evaluation: default

artifact_root: outputs/zeroshot

# Hydra writes its resolved config, overrides and job log beside the sample's
# artifacts instead of into a separate dated tree, so a sample directory says
# what produced it. Single runs and `-m` sweeps land in the same layout.
hydra:
  run:
    dir: ${artifact_root}/${sample.sample_id}
  sweep:
    dir: ${artifact_root}
    subdir: ${sample.sample_id}

# How re-issuing a sweep treats samples that already have a directory.
#   fail  - refuse either way
#   skip  - pass over the ones that reached `run_completed`
#   retry - the same, and redo interrupted ones (or continue `resume_from`)
# No policy skips an interrupted sample; that would report a sweep as done
# with holes in it.
on_existing: fail

# Optional durable reconstruction history to continue. The next stage is
# inferred from its latest committed snapshot; no agent transcript is restored.
resume_from: null

console:
  _target_: zeroshot.pipeline.event_logging.ConsoleReporter
  muted_graph_nodes: []

artifact_presenter:
  _target_: zeroshot.pipeline.messages.artifact.ArtifactPresenter
  input: "path"
  # Each feedback kind: none (omit), path (list), image (list and attach).
  output_renders: "path"
  overlay: "path"
  unmatched: "image"

sandbox_runner:
  python_executable: ${oc.env:CONDA_PREFIX}/bin/python
  default_timeout_s: 30.0
  max_stdout_bytes: 1048576
  max_stderr_bytes: 1048576

# Every path derives from `sample_id`, so a sweep overrides that alone:
#   python -m zeroshot.run_pipeline -m sample.sample_id=000364,000405,000775
sample:
  sample_id: "000364"
  # Reject larger input rasters before running agents; inputs are never resized.
  max_input_image_side: 3000
  drawing:
    # The sheets never draw hidden edges, so the builds' views leave them out too.
    hidden_lines_omitted: false
