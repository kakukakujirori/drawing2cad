# @package _global_

defaults:
  - _self_
  - model: gemma4_ollama

artifact_root: outputs/zeroshot

# Agent turns before the workflow stops asking and runs the final verification.
# Successful runs so far take 2-4; this is a ceiling, not a target. Revise it
# once a multi-sample run reports how often it is reached.
max_agent_turns: 30

console:
  _target_: zeroshot.pipeline.event_logging.ConsoleReporter

message_builder:
  _target_: zeroshot.pipeline.messages.MessageBuilder
  access_render3d: "path"
  access_render3d_styles:
    - hlg_perspective
    - hlg_translucent_faces_perspective
    - transparent_shaded_edges_perspective
  feedback_render3d: "path"
  feedback_render3d_styles:
    - hlg_perspective
    - hlg_translucent_faces_perspective
    - transparent_shaded_edges_perspective

renderer:
  _target_: zeroshot.pipeline.verification.StepRenderer
  timeout_s: 120.0

sandbox_runner:
  python_executable: ${oc.env:CONDA_PREFIX}/bin/python
  default_timeout_s: 30.0
  max_stdout_bytes: 1048576
  max_stderr_bytes: 1048576

# How to score, not what to score: the target lives with the sample it belongs
# to, so switching samples cannot leave a stale target behind.
evaluation:
  last_only: true
  scorer:
    _target_: zeroshot.evaluation.run_scoring.StepScorer
    timeout_s: 600.0
    f1_threshold: 0.1
    normalize_to_gt_bbox: true
    reference_extent: 1.8
    voxel_resolution: 64
    seed: 0

sample:
  sample_id: "000364"
  dxf_path: data/test_vlm/techdraw/dxf/000364.dxf
  target_step_path: data/test_vlm/target_step/000364.step
  render3d_paths:
    hlg_perspective: data/test_vlm/render_3d/hlg_perspective/000364.png
    hlg_translucent_faces_perspective: data/test_vlm/render_3d/hlg_translucent_faces_perspective/000364.png
    transparent_shaded_edges_perspective: data/test_vlm/render_3d/transparent_shaded_edges_perspective/000364.png
