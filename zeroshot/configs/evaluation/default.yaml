# How to score, not what to score: the target lives with the sample it belongs
# to, so switching samples cannot leave a stale target behind. The staged and
# native entrypoints both load this file, so both arms are scored alike.
last_only: false
scorer:
  _target_: zeroshot.evaluation.run_scoring.StepScorer
  timeout_s: 600.0
  f1_threshold: 0.1
  reference_extent: 1.8
  mesh_tolerance: 0.001
  angular_tolerance: 0.1
  sample_points: 8192
  seed: 0
  include_eccv: true
  include_ortho2cad: true
  auc_tr_min_cd: 1.0e-5
  auc_tr_max_cd: 1.0e-1
  auc_tr_num_points: 401
