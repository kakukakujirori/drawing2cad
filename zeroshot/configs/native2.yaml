# @package _global_

# The native baseline plus an auditor, with the staged pipeline's rounds, turn
# budgets and transcript compaction (`workflow/coder_auditor.yaml`).
# `zeroshot.pipeline_native2` loads it.
defaults:
  - native
  - _self_

artifact_root: outputs/zeroshot_native2
# Per coder round, and per audit.
max_turns: 30
auditor_max_turns: 20
# Per-stage retry policy, matching workflow/coder_auditor.yaml.
retry_turns: 10
max_stage_validation_retries: 3
# Audits that may reject and open another coder round.
max_audits: 2
# Choose among completed coder rounds with the auditor's tools and turn budget.
# With zero/one candidate no extra model call is needed.
final_selection: true
# Build and render /work/model.py after each coder turn that changes it, as
# the staged pipeline does, in the six standard views and without drawing
# comparison; the auditor gets the last report. `native2_prime.yaml` sets it.
auto_build: false
# Before an audit that another coder round may follow, replace the coder's
# transcript with notes the same model writes in at most this many output
# tokens, as `workflow.compaction_model` does in the staged pipeline; the next
# round's request then carries the input drawing again. null: the coder keeps
# its whole transcript.
compaction_max_tokens: 32000
