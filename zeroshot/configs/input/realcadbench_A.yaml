# @package _global_

sample:
  drawing:
    # Where the sheets put each view around front. GB (Chinese standard) drawings.
    projection_method: first_angle
    sheets:
      - name: view_drawing
        role: full_page
        file: data/RealCADBench-V1.0/part/input/2d_drawing/${sample.sample_id}_A.png
  target_step_path: data/RealCADBench-V1.0/part/ground_truth/2d_drawing/${sample.sample_id}.stl

artifact_presenter:
  input: "image"
