# @package _global_

# The vector drawing alone. This is what `input/png_dimensioned.yaml` has to be
# compared against: measured against `input/dxf.yaml` instead, the difference
# would hold the change of drawing format and the loss of the perspective
# renders at once, and neither could be attributed.
sample:
  drawing:
    sheets:
      - name: view_drawing
        role: full_page
        file: data/test_vlm/techdraw/dxf/${sample.sample_id}.dxf
  target_step_path: data/test_vlm/target_step_ori/${sample.sample_id}.step

artifact_presenter:
  input: "path"
