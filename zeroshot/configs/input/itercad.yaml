# @package _global_

sample:
  drawing:
    # Where the sheets put each view around front. Not checked against the
    # dataset: the method every sheet was read with before this setting existed.
    projection_method: third_angle
    sheets:
      - name: view_drawing
        role: full_page
        file: data/itercad/benchmark/IterCAD-Draw_1k/images/draw_${sample.sample_id}.png
  target_step_path: data/itercad/benchmark/IterCAD-Draw_1k/stl/draw_${sample.sample_id}.stl

artifact_presenter:
  input: "image"
