# @package _global_

response_format_strategy: provider

model:
  _target_: zeroshot.pipeline.models.codex.ChatCodex
  # The workflow's choice: 20 for pipeline_native, 8 for the staged pipeline.
  image_history_limit: ${oc.select:image_history_limit,8}
  model: gpt-6.1-sol
  reasoning:
    effort: max
    summary: detailed
  output_version: responses/v1
  timeout: 600.0
  max_retries: 0
