_target_: langchain_openai.chat_models.codex._ChatOpenAICodex

model: gpt-5.6-luna
reasoning:
  effort: low
  summary: auto
output_version: responses/v1

timeout: 600.0

# A remote endpoint drops connections; without retries one TLS reset discards
# the whole sample. The local backends keep 0 so a slow generation fails once
# instead of being multiplied.
max_retries: 5
