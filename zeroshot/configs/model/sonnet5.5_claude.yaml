# @package _global_

# Provider structured output cannot reach Claude: ChatClaude sends no response
# format, and Anthropic's json_schema needs closed objects, which the stage
# answers' free-form maps are not. The answer is a tool call instead.
response_format_strategy: tool

model:
  _target_: zeroshot.pipeline.models.claude.ChatClaude
  model: claude-sonnet-5-5
  max_tokens: 128000
  thinking:
    type: adaptive
    display: summarized
    effort: xhigh
  # The workflow's choice: 20 for pipeline_native, 8 for the staged pipeline.
  image_history_limit: ${oc.select:image_history_limit,8}
  # Automatic prompt caching; an entry outlives a 5m gap between calls only at 1h.
  prompt_cache_ttl: 5m
  # Replayed thinking counts as input at full size; past this the oldest goes.
  thinking_replay_budget: 500000
  timeout: 600.0
  max_retries: 0
