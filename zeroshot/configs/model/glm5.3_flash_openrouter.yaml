# @package _global_

# A json_schema response format suppresses this model's tool calling.
response_format_strategy: tool

model:
  _target_: zeroshot.pipeline.models.openrouter.ChatOpenRouterSingleReasoning

  model: z-ai/glm-5.3-flash
  # Effort is a share of max_tokens; OpenRouter takes no `summary`.
  reasoning:
    effort: medium
  output_version: v1
  api_key: ${oc.env:OPENROUTER_API_KEY}

  # Upstreams that support tool_choice, structured outputs and the full context.
  openrouter_provider:
    order: [Together, Fireworks, DeepInfra, Cloudflare]
    allow_fallbacks: false
  # Cloudflare's image limit.
  max_images_per_request: 8

  # Hard turns reason for ~30k tokens; the rest leaves room for a whole program.
  max_tokens: 60000

  timeout: 60000  # milliseconds
  max_retries: 0
