# @package _global_

model:
  _target_: zeroshot.pipeline.models.openrouter.ChatOpenRouter
  image_history_limit: 8
  model: anthropic/claude-opus-5.5
  api_key: ${oc.env:OPENROUTER_API_KEY}
  reasoning:
    effort: max
    exclude: false
  output_version: v1
  max_tokens: 128000
  timeout: 600000  # OpenRouter adapter uses milliseconds.
  max_retries: 0
  openrouter_provider:
    require_parameters: true
