# @package _global_

# The staged graph, run as one agent rather than five. The four reasoning
# stages share one model, one system prompt and one transcript, so the drawing
# is read once for the whole run and the reasoning behind an interpretation
# survives into the stages that depend on it. The fan-out's other proposers and
# the audit still read the drawing themselves: an independent reading is what
# they are for.
defaults:
  - staged
  - _self_

workflow:
  share_thread: true

  # The model that writes the notes a stage's working turns are traded for at
  # each handover. A shared transcript must be compacted: otherwise drawings
  # and their tool results consume the context needed by downstream stages.
  compact_between_stages: ${model}

  # One role for all four stages, so the transcript is never re-read under a
  # persona that did not produce it. `roles/cad_reconstructor.md` takes neither
  # `$output_schema` nor `$max_turns`, so every stage renders it identically
  # while keeping its own turn budget and its own answer contract.
  drawings_agent_builder:
    role: cad_reconstructor
  semantics_agent_builder:
    role: cad_reconstructor
  operations_agent_builder:
    role: cad_reconstructor
  coding_agent_builder:
    role: cad_reconstructor
