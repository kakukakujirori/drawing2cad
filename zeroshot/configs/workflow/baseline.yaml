# @package _global_

defaults:
  - /model: gemma4_ollama
  - _self_

# The graph is a config group so a run records which one it used, in the
# `.hydra/config.yaml` beside its own artifacts. Everything a graph decides
# lives here; the runner only supplies the run environment.
workflow:
  _target_: zeroshot.pipeline.workflow.graph.create_reconstruction_graph
  _partial_: true

  # One agent is one block: who it is, which model answers for it, how long it
  # may run and what it must return. The tools it gets are the graph's call, so
  # each block stays a partial until the graph supplies the run environment.
  semantic_hypothesizer:
    _target_: zeroshot.pipeline.workflow.create_agent
    _partial_: true
    role: semantic_hypothesizer
    model: ${model}

    # The strategy is named rather than inferred: left to auto-detection, a
    # model whose profile omits native structured output would silently switch
    # the agent to a forced submission tool call. Swap in `ToolStrategy` for a
    # backend that cannot take a json_schema response format.
    response_format:
      _target_: langchain.agents.structured_output.ProviderStrategy
      schema:
        _target_: hydra.utils.get_class
        path: zeroshot.pipeline.workflow.state.SemanticHypothesis

    # Agent turns before the workflow stops asking and runs the final
    # verification. Successful runs so far take 2-4; this is a ceiling, not a
    # target. Revise it once a multi-sample run reports how often it is reached.
    max_turns: 30

    # Show the agent its remaining turns before each call. Off keeps this graph
    # identical to the one that produced the recorded baselines.
    announce_turn_budget: true

  semantic_reviewer:
    _target_: zeroshot.pipeline.workflow.create_agent
    _partial_: true
    role: semantic_reviewer
    model: ${model}

    response_format:
      _target_: langchain.agents.structured_output.ProviderStrategy
      schema:
        _target_: hydra.utils.get_class
        path: zeroshot.pipeline.workflow.state.SemanticHypothesisReview

    # A reviewer reads one hypothesis and answers; it has no debug loop to run.
    max_turns: 5
    announce_turn_budget: true

  coder:
    _target_: zeroshot.pipeline.workflow.create_agent
    _partial_: true
    role: coder
    model: ${model}

    # No response format: the coder's product is the file it wrote and the
    # verification it passed, not a JSON document.
    max_turns: 30
    announce_turn_budget: true

  # Re-invocations after a transport failure the client cannot retry itself,
  # such as a connection dropped mid-body. A retry resends the whole history,
  # but exhausting all of them still costs less than the sample they save.
  model_retries: 5
