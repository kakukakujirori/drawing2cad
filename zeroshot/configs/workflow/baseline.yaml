# @package _global_

defaults:
  - /model: gemma4_ollama
  - _self_

# The graph is a config group so a run records which one it used, in the
# `.hydra/config.yaml` beside its own artifacts. Everything a graph decides
# lives here; the runner only supplies the run environment.
workflow:
  _target_: zeroshot.pipeline.workflow.graph.create_reconstruction_graph
  _partial_: true

  agent:
    _target_: zeroshot.pipeline.workflow.AgentSpec
    role: coder
    model: ${model}

    # Agent turns before the workflow stops asking and runs the final
    # verification. Successful runs so far take 2-4; this is a ceiling, not a
    # target. Revise it once a multi-sample run reports how often it is reached.
    max_turns: 30

    # Show the agent its remaining turns before each call. Off keeps this graph
    # identical to the one that produced the recorded baselines.
    announce_turn_budget: true

  # Re-invocations after a transport failure the client cannot retry itself,
  # such as a connection dropped mid-body. A retry resends the whole history,
  # but exhausting all of them still costs less than the sample they save.
  model_retries: 5
