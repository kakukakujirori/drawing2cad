# @package _global_

defaults:
  - /model: gemma4_ollama
  - _self_

# Images per request, input drawings included, for the model configs that defer
# to the workflow (Claude, GPT). Outside `workflow`, which is instantiated.
image_history_limit: 8

# The graph is a config group so a run records which one it used, in the
# `.hydra/config.yaml` beside its own artifacts. Everything a graph decides
# lives here; the runner only supplies the run environment.
workflow:
  _target_: zeroshot.pipeline.workflow.graph.create_reconstruction_graph
  _partial_: true

  # Drop coder history older than the latest verified build from each request.
  fresh_coder: false
  # Give the coder evaluate_cad_hypothesis; off, it tries hypotheses only in model.py.
  coding_trial_tool: true
  # After this many turns, suggest each turn what the coder still owes:
  # interpretation.json until it is valid, then model.py until it differs from
  # the round's starting program, then testing unresolved geometry in code.
  # null: no suggestion.
  coding_draft_check_after_n_turns: 20
  # The auditor must answer every drawing_diff cluster in concern_reviews.
  review_drawing_diff_clusters: true
  # A region index (zeroshot/pipeline/retrieval/build_from_runs.py) gives both
  # agents search_semantic_features; null leaves the tool out.
  retrieval_db: null

  # Set diff_drawer_config: null to disable drawing comparison.
  diff_drawer_config:
    backend: directional_chamfer
    model: similarity
    timeout_seconds: 180.0
    distance_clip_px: 12.0  # null: normalize colors by each image's maximum distance
    alignment_options:
      scale_tolerance: 0.01  # constrain calibrated mm/pixel scale to +/-1%
      relative_scale: [0.45, 1.1]
      rotation_degrees: 1.0  # drawings are axis-aligned; wider fits a rotated wrong pose
      outline_weight: 0.8

      pyramid: [0.5, 1.0]
      top_k: 4
  # The coder hears "no measurable change" for match score changes below this
  # (input px, the unit of the score diff_drawer_config computes).
  match_margin_px: 0.5

  coding_agent_builder:
    _target_: zeroshot.pipeline.workflow.create_agent
    _partial_: true
    role: coder
    model: ${model}

    response_format_strategy: ${response_format_strategy}
    max_turns: 60
    # A retry of a refused answer keeps the turn count, set back if fewer than
    # this many turns remain. null: a retry is handled like any re-entry.
    retry_turns: 10
    announce_turns: true
    reset_turns_when_reentrant: true
    model_call_retries: 5
    checkpointer: false

  audit_agent_builder:
    _target_: zeroshot.pipeline.workflow.create_agent
    _partial_: true
    role: output_auditor
    model: ${model}

    response_format_strategy: ${response_format_strategy}
    max_turns: 20
    retry_turns: 10
    announce_turns: true
    reset_turns_when_reentrant: true
    model_call_retries: 5
    checkpointer: false

  # The coder's transcript is compacted before audit when another round may
  # follow, so that round starts from notes rather than raw turns.
  compaction_model:
    _target_: zeroshot.pipeline.workflow.components.compact.compaction_model
    model: ${model}
    # At most this many output tokens for the notes, leaving the rest of the
    # context window to the transcript. A lower or unset model max_tokens stays.
    max_tokens: 32000
  # Before re-asking a coder whose turns ran out, compact its transcript the same
  # way and restate the round's instructions: never, once a round (the first
  # time its turns run out), or every time.
  compact_exhausted_coder: never

  # How many rejected audits may open a fresh round.
  max_audit_reject_count: 1

  # Invalid structured stage submissions return to that stage with the
  # validator's exact feedback. This bounds those graph-level retries.
  max_stage_validation_retries: 3

  # Stop on this many output-limit failures across all stage agents and rounds.
  # A new run starts from zero. The cap must be a positive integer.
  max_output_limit_failures: 3
