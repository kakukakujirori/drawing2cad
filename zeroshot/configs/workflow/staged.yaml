# @package _global_

defaults:
  - /model: gemma4_ollama
  - _self_

# The graph is a config group so a run records which one it used, in the
# `.hydra/config.yaml` beside its own artifacts. Everything a graph decides
# lives here; the runner only supplies the run environment.
workflow:
  _target_: zeroshot.pipeline.workflow.graph.create_reconstruction_graph
  _partial_: true

  semantics_agent_builder:
    _target_: zeroshot.pipeline.workflow.create_agent
    _partial_: true
    role: semantic_hypothesizer
    model: ${model}

    response_format_strategy: ${response_format_strategy}
    max_turns: 20
    announce_turns: true
    reset_turns_when_reentrant: true
    model_retries: 5
    checkpointer: false

  operations_agent_builder:
    _target_: zeroshot.pipeline.workflow.create_agent
    _partial_: true
    role: operation_planner
    model: ${model}

    response_format_strategy: ${response_format_strategy}
    max_turns: 20
    announce_turns: true
    reset_turns_when_reentrant: true
    model_retries: 5
    checkpointer: false

  coding_agent_builder:
    _target_: zeroshot.pipeline.workflow.create_agent
    _partial_: true
    role: coder
    model: ${model}

    response_format_strategy: ${response_format_strategy}
    max_turns: 20
    announce_turns: true
    reset_turns_when_reentrant: true
    model_retries: 5
    checkpointer: false

  audit_agent_builder:
    _target_: zeroshot.pipeline.workflow.create_agent
    _partial_: true
    role: output_auditor
    model: ${model}

    response_format_strategy: ${response_format_strategy}
    max_turns: 20
    announce_turns: true
    reset_turns_when_reentrant: true
    model_retries: 5
    checkpointer: false

  # How many rejected audits may open a fresh round. Every new round runs all
  # three reasoning stages against the complete set of new tickets.
  max_audit_reject_count: 1  # 3

  # Invalid structured stage submissions return to that stage with the
  # validator's exact feedback. This bounds those graph-level retries.
  max_stage_validation_retries: 3

  # Show the coder what every ret_xxx came out as: one census line per return,
  # and a drawing and renders beside its STEP. Costs a render per return: one
  # measured attempt went from 7s and 0.6MB to 99s and 9.8MB.
  show_intermediate_returns: true
