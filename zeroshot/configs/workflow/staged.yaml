# @package _global_

defaults:
  - /model: gemma4_ollama
  - _self_

# The graph is a config group so a run records which one it used, in the
# `.hydra/config.yaml` beside its own artifacts. Everything a graph decides
# lives here; the runner only supplies the run environment.
workflow:
  _target_: zeroshot.pipeline.workflow.graph.create_reconstruction_graph
  _partial_: true

  semantics_agent_builder:
    _target_: zeroshot.pipeline.workflow.create_fanout_reduce_graph
    _partial_: true

    proposer_role: semantic_hypothesizer
    proposer_models:
      - ${model}
      - ${model}
    response_format_strategy: provider
    max_proposer_turns: 20
    max_reducer_turns: 10
    announce_turns: true
    # Sole retry owner; model SDK configs keep max_retries at 0.
    model_retries: 5
    checkpointer: false

  operations_agent_builder:
    _target_: zeroshot.pipeline.workflow.create_agent
    _partial_: true
    role: operation_planner
    model: ${model}

    response_format_strategy: provider
    max_turns: 10
    announce_turns: true
    reset_turns_when_reentrant: true
    model_retries: 5
    checkpointer: false

  coding_agent_builder:
    _target_: zeroshot.pipeline.workflow.create_agent
    _partial_: true
    role: coder
    model: ${model}

    response_format_strategy: provider
    max_turns: 10
    announce_turns: true
    reset_turns_when_reentrant: true
    model_retries: 5
    checkpointer: false

  audit_agent_builder:
    _target_: zeroshot.pipeline.workflow.create_agent
    _partial_: true
    role: output_auditor
    model: ${model}

    response_format_strategy: provider
    max_turns: 10
    announce_turns: true
    reset_turns_when_reentrant: true
    model_retries: 5
    checkpointer: false

  # How many times the audit may send the run back to an earlier stage. Every
  # send-back re-runs everything downstream of its target, so this bounds the
  # whole graph's cycle rather than one agent invocation.
  max_audit_reject_count: 1
