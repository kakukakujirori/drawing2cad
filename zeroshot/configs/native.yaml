# @package _global_

# The native baseline's counterpart of `default.yaml`: one agent, no graph, so
# it selects no `workflow`. `zeroshot.pipeline_native` loads it.
defaults:
  - input: test_eccv
  - model: gpt6_luna_codex
  - evaluation: default
  - _self_

artifact_root: outputs/zeroshot_native
console: true
model_retries: 5
max_turns: 150
# Images per request, input drawings included, for the model configs that defer
# to the workflow (Claude, GPT). Above 8, Claude seldom has a turn edited, which
# withholds its earlier thinking and restarts the prompt cache. Claude allows
# images over 2000 px only up to 20 per request, and the drawings are 2337 px.
image_history_limit: 20

# fail: refuse existing runs; skip: skip completed generations, refuse incomplete
# ones; retry: skip completed generations and restart failed/interrupted ones.
on_existing: fail

sample:
  sample_id: "000364"
  max_input_image_side: 3000

sandbox_runner:
  python_executable: null
  default_timeout_s: 30.0
  max_stdout_bytes: 1048576
  max_stderr_bytes: 1048576

hydra:
  run:
    dir: ${artifact_root}/${sample.sample_id}
  sweep:
    dir: ${artifact_root}
    subdir: ${sample.sample_id}
